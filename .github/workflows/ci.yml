name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Validate and test workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate personal site, genealogy content, and genealogy app
        run: npm run validate:workspace

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build-personal:
    name: Build personal site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify all personal page fingerprints
        env:
          PAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run pages:check:personal -- --base-ref "$PAGE_BASE_REF"

  build-genealogy:
    name: Build Where the Record Ends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify all genealogy page fingerprints
        env:
          PAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run pages:check -- --base-ref "$PAGE_BASE_REF"
